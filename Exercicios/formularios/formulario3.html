<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>formulario web</title>
</head>
<body>
<h1>Pesquisa de satisfação do cliente</h1>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>
    <label>
        Empresa:
        <input name="form_empresa" type="text" placeholder="Digite o nome da sua empresa" required>
    </label>
    <br>
    <br>
    <label> Idade: </label><br>
    <label>
        <input name="form_idade"  value="1" type="radio">
        10-20 anos
    </label>
    <label>
        <input name="form_idade"  value="2" type="radio">
        20-30 anos
    </label>
    <label>
        <input name="form_ano"  value="3" type="radio">
        30-50 anos
    </label>
    <label>
        <input name="form_ano"  value="3" type="radio">
        50-80 anos
    </label>
    <br>
    <br>
    <label>
        E-mail:
        <input name="form_email" type="email" placeholder="Ex:fera@gmail.com" required>
    </label>
    <br>
    <br>
    <label>
        Telefone comercial:
        <input name="form_telefone" type="tel" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" placeholder="18 99133-8586" required>
    </label>
    <label>
        celular:
        <input name="form_telefone1" type="tel" pattern="[0-9] {2}[0-9]{5}-[0-9]{4}" placeholder="18 99133-8586" required>
    </label>
    <br>
    <br>
    <label>Como você avalia os nossos serviços atualmente?</label>
    <label>
        <input name="form_avaliacao" value="1" type="radio" required>
        Regular
    </label>
    <label>
        <input name="form_avaliacao" value="2" type="radio" required>
        Bom
    </label>
    <label>
        <input name="form_avaliacao" value="3" type="radio" required>
        Excelente
    </label>
    <br>
    <br>
    <label>Como você avalia os serviços da área operacional?</label>
    <label>
        <input name="form_servico" value="1" type="radio" required>
        Regular
    </label>
    <label>
        <input name="form_servico" value="2" type="radio" required>
        Bom
    </label>
    <label>
        <input name="form_servico" value="3" type="radio" required>
        Excelente
    </label>
    <br>
    <br>
    <label>Qual o nível de satisfação com o atendimento administrativo quando você precisa?</label>
    <label>
        <input name="form_atendimento" value="1" type="radio" required>
        Pouco satisfatório
    </label>
    <label>
        <input name="form_atendimento" value="2" type="radio" required>
        Satisfatório
    </label>
    <label>
        <input name="form_atendimento" value="3" type="radio" required>
        Muito satisfatório
    </label>
    <br>
    <br>
    <label>Os profissionais te atendem de forma satisfatória?</label>
    <label>
        <input name="form_satisfacao" value="1" type="radio" required>
        Não
    </label>
    <label>
        <input name="form_satisfacao" value="2" type="radio" required>
        Sim
    </label>
    <br>
    <br>
    <label>
        Você tem alguma sugestão ou crítica a fazer para cada vez mais melhoramos nossos serviços?<br>
        <textarea name="form_sugestao" rows="10" cols="100" placeholder="Escreva neste quadro " required> </textarea>
    </label>
    <br>
    <br>
    <button type="submit">Salvar </button>
    <button type="reset">redefinir</button>
</body>
</html>
