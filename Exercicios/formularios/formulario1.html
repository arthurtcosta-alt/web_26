<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-mail</title>
</head>
<body>
<h1>Enviar E-mail</h1>
<form action="" method="post">
    <label>
        Nome:
        <input name="form_nome" type="text" placeholder="Digite seu nome" required>
    </label>
    <br>
    <br>
    <label>
        E-mail:
        <input name="form_email" type="email" placeholder="Ex:endereço@gmail.com" required>
    </label>
    <br>
    <br>
    <label>
        Assunto:
        <input name="form_assunto" type="text" placeholder="Assunto" required>
    </label>
    <br>
    <br>
    <label>
        Mensagem:<br>
        <textarea name="form_mensagem" rows="10" cols="50"></textarea>
    </label>
    <br>
    <br>
    <button type="submit">Salvar </button>
    <button type="reset">redefinir</button>
</body>
</html>
